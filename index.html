<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammad Ribhan Hadiyan — Data Scientist & Mathematician</title>
    <meta name="description" content="Data Science & Modelling Specialist at BFI Finance with a Mathematics background. Building behavior-based collection models, monitoring systems, and ML solutions." />

    <!-- Open Graph -->
    <meta property="og:title" content="Muhammad Ribhan Hadiyan — Data Scientist & Mathematician" />
    <meta property="og:description" content="Data Science & Modelling Specialist at BFI Finance · TensorFlow Certified · 4+ Publications" />
    <meta property="og:image" content="img/ribhanhadiyan.png" />
    <meta property="og:type" content="website" />

    <link rel="icon" href="img/logo_hadyan.png" type="image/x-icon" />

    <!-- ⚡ Anti-flash: set theme SEBELUM CSS dimuat -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
          var lang = localStorage.getItem('lang');
          if (lang) document.documentElement.setAttribute('lang', lang);
        } catch (e) {}
      })();
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ── Navbar ── -->
    <nav class="navbar navbar-expand-lg fixed-top" id="navbar">
      <div class="container">
        <a class="navbar-brand" href="#home">
          <img id="brandLogo" src="" alt="Logo" />
          <span id="brandName"></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto" id="navMenu"></ul>

          <div class="nav-controls">
            <!-- 🌐 Language Switcher -->
            <div class="lang-switcher" id="langSwitcher"></div>

            <!-- 🎛️ Theme Toggle -->
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
              <i class="fas fa-moon icon-moon"></i>
              <i class="fas fa-sun icon-sun"></i>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- ── Hero ── -->
    <section id="home" class="hero">
      <div id="particles-js"></div>
      <div class="container hero-content">
        <div class="hero-left">
          <span class="hero-eyebrow" id="heroEyebrow"></span>
          <h1 class="hero-name" id="heroName"></h1>
          <p class="hero-role"><span id="typing-text"></span></p>
          <div class="hero-divider"></div>
          <p class="hero-desc" id="heroDesc"></p>
          <div class="hero-actions" id="heroActions"></div>
        </div>
        <div class="hero-right">
          <div class="profile-img-frame">
            <img id="heroPhoto" src="" alt="Profile" class="profile-img" />
          </div>
        </div>
      </div>
      <div class="hero-scroll-hint">
        <span class="scroll-text">Scroll</span>
        <div class="scroll-line"></div>
      </div>
    </section>

    <!-- ── About ── -->
    <section id="about" class="about">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="section-label" id="aboutLabel"></span>
            <h2 class="section-title" id="aboutTitle"></h2>
          </div>
        </div>

        <div class="about-grid">
          <div class="about-text">
            <div id="aboutParagraphs"></div>
            <div class="about-stat-row" id="aboutStats"></div>
          </div>
        </div>

        <div class="skills-showcase">
          <div class="skills-showcase-header">
            <div>
              <span class="skills-label" id="skillsLabel"></span>
              <h3 class="skills-title" id="skillsTitle"></h3>
            </div>
            <p class="skills-hint" id="skillsHint"></p>
          </div>
          <div class="skills-showcase-body">
            <div class="skill-graph-wrap">
              <svg id="skillGraph" viewBox="0 0 720 520" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
            <aside class="skill-evidence" id="skillEvidence"></aside>
          </div>
        </div>
      </div>
    </section>

    <!-- ── Career Timeline (Gantt) ── -->
    <section id="career" class="career-timeline">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="section-label" id="careerLabel"></span>
            <h2 class="section-title" id="careerTitle"></h2>
          </div>
        </div>
        <div class="gantt-wrap">
          <div class="gantt-legend" id="ganttLegend"></div>
          <div class="gantt-chart" id="ganttChart"></div>
        </div>
      </div>
    </section>

    <!-- ── Experience ── -->
    <section id="experience" class="experience">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="section-label" id="expLabel"></span>
            <h2 class="section-title" id="expTitle"></h2>
          </div>
        </div>
        <div class="exp-list timeline" id="experienceList"></div>
      </div>
    </section>

    <!-- ── Projects ── -->
    <section id="projects">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="section-label" id="projLabel"></span>
            <h2 class="section-title" id="projTitle"></h2>
          </div>
        </div>
        <div class="projects-grid" id="projectsGrid"></div>
      </div>
    </section>

    <!-- ── Publications ── -->
    <section id="publications" style="padding: 120px 0; background-color: var(--off-white)">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="section-label" id="pubLabel"></span>
            <h2 class="section-title" id="pubTitle"></h2>
          </div>
        </div>
        <div class="exp-list timeline" id="publicationsList"></div>
      </div>
    </section>

    <!-- ── Education ── -->
    <section id="education" style="padding: 120px 0; background-color: var(--white)">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="section-label" id="eduLabel"></span>
            <h2 class="section-title" id="eduTitle"></h2>
          </div>
        </div>
        <div class="exp-list timeline" id="educationList"></div>
      </div>
    </section>

    <!-- ── Certificates ── -->
    <section id="certificates">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="section-label" id="certLabel"></span>
            <h2 class="section-title" id="certTitle"></h2>
          </div>
        </div>
        <div class="certs-grid" id="certsGrid"></div>
      </div>
    </section>

    <!-- ── Contact ── -->
    <section id="contact" class="contact">
      <div class="container">
        <span class="section-label" id="contactLabel"></span>
        <h2 class="section-title" id="contactTitle"></h2>
        <div class="contact-inner">
          <p class="contact-tagline" id="contactTagline"></p>
          <div>
            <a href="#" id="contactEmail" class="contact-email"></a>
            <div class="social-links" id="socialLinks"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ── Footer ── -->
    <footer>
      <div class="container">
        <div class="footer-inner">
          <span class="footer-copy" id="footerCopyright"></span>
          <span class="footer-copy" id="footerTagline"></span>
        </div>
      </div>
    </footer>

    <!-- ⬆️ Back to Top -->
    <button id="backToTop" class="back-to-top" aria-label="Back to top" type="button">
      <i class="fas fa-arrow-up"></i>
    </button>

    <!-- ── Certificate Modal ── -->
    <div class="modal fade" id="certificateModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <img src="" id="modalImage" class="modal-img" alt="Certificate" />
            <a href="" id="modalLink" class="modal-link" target="_blank" rel="noopener" style="display: none;">
              <i class="fas fa-external-link-alt"></i>
              <span id="modalLinkText">View Original</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
